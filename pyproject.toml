[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ridesplat"
version = "0.0.1"
description = "Reflection-free 3D reconstruction from driving video"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["lpips", "numpy", "opencv-python-headless", "pillow", "scikit-image", "scipy", "torch"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
